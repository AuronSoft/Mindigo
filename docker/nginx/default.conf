# Nginx config cho Mindigo LMS
# Serve static từ /var/www/html/public (volume dùng chung "web_public"),
# proxy request PHP tới php-fpm (service app, cổng 9000).

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # Kích thước upload (khớp php.ini)
    client_max_body_size 30M;

    # Assets đã build (public/build) — phục vụ trực tiếp, cache lâu.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_read_timeout 300;
    }

    # Chặn truy cập file nhạy cảm
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt  { allow all; log_not_found off; access_log off; }
}
