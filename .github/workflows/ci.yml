name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  code-quality:
    name: Lint & tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, exif, gd, mbstring, pdo_sqlite, sqlite3, zip
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Lint PHP (Pint)
        run: ./vendor/bin/pint --test

      - name: Run Laravel tests
        run: composer test

  build-images:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build app image
        run: docker compose build app

      - name: Build nginx image
        run: docker compose build web

  # Auto-merge: gộp PR vào dev khi tất cả checks (kể cả job này) đạt.
  auto-merge-dev:
    name: Auto-merge PR to dev
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'dev'
    runs-on: ubuntu-latest
    needs: [code-quality, build-images]
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Enable auto-merge on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${{ github.event.pull_request.number }}" \
            --squash \
            --auto \
            --repo "${{ github.repository }}" \
            || echo "Auto-merge could not be enabled (review required or conflict)."
