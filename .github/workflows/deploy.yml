name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.inputs.branch || github.ref_name }}
  cancel-in-progress: true

jobs:
  ci-and-notify:
    name: CI and notify webhook
    runs-on: ubuntu-latest

    steps:
      - name: Prepare deployment variables
        id: vars
        run: |
          BRANCH="${{ github.event.inputs.branch || github.ref_name }}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.vars.outputs.branch }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, exif, gd, mbstring, pdo_sqlite, sqlite3, zip
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Run Laravel tests
        continue-on-error: true
        run: composer test

      - name: Build Docker app image
        run: docker compose build app

      - name: Notify Ubuntu deploy webhook
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          DEPLOY_BRANCH: ${{ steps.vars.outputs.branch }}
          COMMIT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import hashlib
          import hmac
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          url = os.environ.get("WEBHOOK_URL", "").strip()
          secret = os.environ.get("WEBHOOK_SECRET", "")

          if not url:
              raise SystemExit("WEBHOOK_URL secret is missing")
          if not secret:
              raise SystemExit("WEBHOOK_SECRET secret is missing")

          payload = {
              "repository": os.environ["REPOSITORY"],
              "branch": os.environ["DEPLOY_BRANCH"],
              "commit": os.environ["COMMIT_SHA"],
              "workflow_run_id": os.environ["WORKFLOW_RUN_ID"],
          }
          body = json.dumps(payload, separators=(",", ":"), sort_keys=True).encode("utf-8")
          signature = hmac.new(secret.encode("utf-8"), body, hashlib.sha256).hexdigest()

          request = urllib.request.Request(
              url,
              data=body,
              method="POST",
              headers={
                  "Content-Type": "application/json",
                  "X-Mindigo-Signature": f"sha256={signature}",
              },
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  print(response.read().decode("utf-8", errors="replace"))
                  print(f"Webhook status: {response.status}")
          except urllib.error.HTTPError as exc:
              print(exc.read().decode("utf-8", errors="replace"), file=sys.stderr)
              raise
          PY
