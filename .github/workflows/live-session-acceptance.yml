name: Live classroom acceptance

on:
  workflow_dispatch:
  schedule:
    - cron: "30 18 * * 0"

permissions:
  contents: read

jobs:
  browser-e2e:
    name: E2E ${{ matrix.browser }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            browser: chrome
          - os: ubuntu-latest
            browser: firefox
          - os: windows-latest
            browser: edge
    runs-on: ${{ matrix.os }}
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: database/e2e.sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, exif, gd, mbstring, pdo_sqlite, sqlite3, zip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci
      - name: Prepare E2E database
        shell: bash
        run: |
          cp .env.example .env
          php artisan key:generate --force
          touch database/e2e.sqlite
          php artisan migrate:fresh --seed --force
      - name: Install Firefox
        if: matrix.browser == 'firefox'
        run: npx playwright install --with-deps firefox
      - name: Start application
        shell: bash
        run: php artisan serve --host=127.0.0.1 --port=8000 > e2e-server.log 2>&1 &
      - name: Wait for application
        shell: bash
        run: |
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/login >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - run: npm run test:e2e:${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-${{ matrix.browser }}
          path: |
            playwright-report
            test-results
            e2e-server.log
