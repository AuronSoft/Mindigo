name: mindigo-dev

x-app-environment: &app-environment
  APP_NAME: Mindigo
  APP_ENV: local
  APP_KEY: base64:MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=
  APP_DEBUG: "true"
  APP_URL: http://localhost:8083
  LOG_CHANNEL: stderr
  LOG_LEVEL: debug
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: mindigo
  DB_USERNAME: mindigo
  DB_PASSWORD: mindigo_local
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  QUEUE_CONNECTION: redis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_CLIENT: predis
  BROADCAST_CONNECTION: reverb
  REVERB_APP_ID: mindigo-local
  REVERB_APP_KEY: mindigo-local-key
  REVERB_APP_SECRET: mindigo-local-secret
  REVERB_SERVER_HOST: 0.0.0.0
  REVERB_SERVER_PORT: 8080
  REVERB_HOST: reverb
  REVERB_PORT: 8080
  REVERB_SCHEME: http
  MAIL_MAILER: log
  FILESYSTEM_DISK: local

x-app-service: &app-service
  image: mindigo/dev-app:local
  build:
    context: .
    dockerfile: Dockerfile.dev
    args:
      VITE_REVERB_PORT: ${DEV_REVERB_PORT:-8082}
  environment: *app-environment
  restart: unless-stopped
  networks:
    - backend

services:
  app:
    <<: *app-service
    environment:
      <<: *app-environment
      APP_BOOTSTRAP: "true"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
      - framework_data:/var/www/html/storage/framework
      - bootstrap_cache_data:/var/www/html/bootstrap/cache
      - uploads_data:/var/www/html/storage/app/public
      - private_storage_data:/var/www/html/storage/app/private
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend
      - web

  nginx:
    image: mindigo/dev-nginx:local
    build:
      context: .
      dockerfile: Dockerfile.nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DEV_HTTP_PORT:-8083}:80"
    volumes:
      - ./public:/var/www/html/public
      - uploads_data:/var/www/html/public/storage:ro
    networks:
      - web

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: mindigo
      MYSQL_USER: mindigo
      MYSQL_PASSWORD: mindigo_local
      MYSQL_ROOT_PASSWORD: mindigo_root_local
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -pmindigo_root_local --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - backend

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - backend

  queue:
    <<: *app-service
    command: ["php", "artisan", "queue:work", "redis", "--sleep=1", "--tries=3", "--timeout=120"]
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
      - framework_data:/var/www/html/storage/framework
      - bootstrap_cache_data:/var/www/html/bootstrap/cache
      - uploads_data:/var/www/html/storage/app/public
      - private_storage_data:/var/www/html/storage/app/private

  scheduler:
    <<: *app-service
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
      - framework_data:/var/www/html/storage/framework
      - bootstrap_cache_data:/var/www/html/bootstrap/cache
      - uploads_data:/var/www/html/storage/app/public
      - private_storage_data:/var/www/html/storage/app/private

  reverb:
    <<: *app-service
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DEV_REVERB_PORT:-8082}:8080"
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
      - framework_data:/var/www/html/storage/framework
      - bootstrap_cache_data:/var/www/html/bootstrap/cache
      - uploads_data:/var/www/html/storage/app/public
      - private_storage_data:/var/www/html/storage/app/private
    networks:
      - backend
      - web

  vite:
    image: node:22-alpine
    working_dir: /var/www/html
    command: ["sh", "-c", "rm -f public/hot; trap 'rm -f public/hot' EXIT INT TERM; npm ci && npm run dev -- --host 0.0.0.0"]
    environment:
      APP_URL: http://localhost:8083
      VITE_APP_NAME: Mindigo
      VITE_DEV_SERVER_HOST: localhost
      VITE_DEV_SERVER_PORT: ${DEV_VITE_PORT:-5173}
      VITE_DEV_SERVER_URL: http://localhost:${DEV_VITE_PORT:-5173}
      VITE_REVERB_APP_KEY: mindigo-local-key
      VITE_REVERB_HOST: localhost
      VITE_REVERB_PORT: ${DEV_REVERB_PORT:-8082}
      VITE_REVERB_SCHEME: http
    ports:
      - "127.0.0.1:${DEV_VITE_PORT:-5173}:5173"
    volumes:
      - .:/var/www/html
      - node_modules_data:/var/www/html/node_modules
    restart: unless-stopped
    networks:
      - web

volumes:
  mysql_data:
  redis_data:
  uploads_data:
  private_storage_data:
  vendor_data:
  node_modules_data:
  framework_data:
  bootstrap_cache_data:

networks:
  backend:
    internal: true
  web:
    driver: bridge
